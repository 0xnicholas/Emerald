version: "3.8"

services:
  # ============================================
  # API 服务
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      # 单一构建：worker/beat/mcp 复用本镜像（同一引擎进程家族，避免重复构建 4 份）
    image: emerald-api:latest
    container_name: emerald-api
    command: uvicorn emerald.api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"  # H1: 仅本机调试；对外流量走 nginx :80
    volumes:
      - .:/app
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - emerald-net

  # ============================================
  # Celery Worker
  # ============================================
  worker:
    # 复用 api 构建的 emerald-api 镜像（不再单独 build）
    image: emerald-api:latest
    container_name: emerald-worker
    command: celery -A emerald.pipeline.celery worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
    env_file:
      - .env.docker
    depends_on:
      - api
      - redis
      - postgres
      - neo4j
    networks:
      - emerald-net

  # ============================================
  # Celery Beat (定时任务)
  # ============================================
  beat:
    # 复用 api 构建的 emerald-api 镜像（不再单独 build）
    image: emerald-api:latest
    container_name: emerald-beat
    command: celery -A emerald.pipeline.celery beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env.docker
    depends_on:
      - redis
      - postgres
    networks:
      - emerald-net

  # ============================================
  # PostgreSQL + pgvector
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: emerald-postgres
    environment:
      POSTGRES_DB: emerald
      POSTGRES_USER: emerald
      POSTGRES_PASSWORD: emerald_dev
    ports:
      - "127.0.0.1:5433:5432"  # H1: 仅本机调试
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emerald"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - emerald-net

  # ============================================
  # Neo4j (知识图谱)
  # ============================================
  neo4j:
    image: neo4j:5-community
    container_name: emerald-neo4j
    environment:
      NEO4J_AUTH: neo4j/emerald_dev
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7474:7474"  # H1: 仅本机调试
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "emerald_dev", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - emerald-net

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:8.0-alpine
    container_name: emerald-redis
    command: redis-server --appendonly yes --requirepass emerald_dev
    ports:
      - "127.0.0.1:6380:6379"  # H1: 仅本机调试
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - emerald-net

  # ============================================
  # MinIO (文件存储)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: emerald-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: emerald_admin
      MINIO_ROOT_PASSWORD: emerald_dev123
    ports:
      - "127.0.0.1:9002:9000"  # H1: 仅本机调试
      - "127.0.0.1:9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emerald-net

  # ============================================
  # MinIO 初始化 (创建 buckets)
  # ============================================
  minio-init:
    image: minio/mc:latest
    container_name: emerald-minio-init
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 emerald_admin emerald_dev123; do
        echo 'Waiting for MinIO...'; sleep 2;
      done;
      mc mb --ignore-existing local/emerald-documents;
      mc mb --ignore-existing local/emerald-temp;
      mc ilm rule add --expire-days 1 local/emerald-temp;
      echo 'Buckets created';
      exit 0;
      "
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - emerald-net

  # ============================================
  # MCP Server
  # ============================================
  mcp:
    # 复用 api 构建的 emerald-api 镜像（不再单独 build）
    image: emerald-api:latest
    container_name: emerald-mcp
    command: python -m emerald.mcp.server --transport sse --port 8001
    ports:
      - "127.0.0.1:8001:8001"  # H1: 仅本机调试
    env_file:
      - .env.docker
    depends_on:
      - api
    networks:
      - emerald-net

  # ============================================
  # Frontend (Next.js Dashboard)
  # ============================================
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runner
    container_name: emerald-frontend
    # H2: 生产构建（standalone runner）。dev 工作流：docker compose -f docker-compose.yml -f docker-compose.dev.yml up
    # H1: 不发布端口——nginx 经内网 frontend:3000 代理，对外仅 :80
    # D3: chat LLM 配置仅经环境变量注入（宿主根 .env / shell，compose 插值），不落浏览器；无 key = C3 降级态
    # OPENAI_BASE_URL/OPENAI_MODELS：OpenAI 兼容后端支持（如 DeepSeek），空 = OpenAI 官方默认
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODELS=${OPENAI_MODELS:-}
    depends_on:
      - api
    networks:
      - emerald-net

  # ============================================
  # Nginx (反向代理)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: emerald-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - emerald-net

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  minio_data:

networks:
  emerald-net:
    driver: bridge
