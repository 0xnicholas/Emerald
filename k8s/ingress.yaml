apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emerald-ingress
  namespace: emerald
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  rules:
    - host: emerald.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emerald-api
                port:
                  number: 80
