apiVersion: batch/v1
kind: CronJob
metadata:
  name: emerald-postgres-backup
  namespace: emerald
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: postgres:16
              command:
                - /bin/sh
                - -c
                - |
                  pg_dump -h emerald-postgres -U emerald emerald |
                  gzip > /backups/emerald-$(date +%Y%m%d-%H%M%S).sql.gz
              envFrom:
                - secretRef:
                    name: emerald-secrets
              volumeMounts:
                - name: backups
                  mountPath: /backups
          restartPolicy: OnFailure
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: emerald-backup-pvc
