openapi: 3.1.0
info:
  title: Emerald
  description: Memory and context infrastructure for AI agents
  version: 0.3.0
  contact:
    name: Emerald
    url: https://emerald.ai
  license:
    name: MIT
paths:
  /v1/memories:
    post:
      tags:
      - Memories
      summary: Add Memory
      description: Add content to the memory graph.
      operationId: add_memory_v1_memories_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemoryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Add Memory V1 Memories Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/memories/{memory_id}:
    get:
      tags:
      - Memories
      summary: Get Memory
      description: Get a single memory by ID.
      operationId: get_memory_v1_memories__memory_id__get
      parameters:
      - name: memory_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Memory V1 Memories  Memory Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Memories
      summary: Update Memory
      description: Update a memory's content, summary, type, and/or confidence.
      operationId: update_memory_v1_memories__memory_id__patch
      parameters:
      - name: memory_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemoryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Memory V1 Memories  Memory Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Memories
      summary: Delete Memory
      description: Delete a memory by ID (soft delete — mark as not latest).
      operationId: delete_memory_v1_memories__memory_id__delete
      parameters:
      - name: memory_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Delete Memory V1 Memories  Memory Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/memories/{memory_id}/validate:
    post:
      tags:
      - Memories
      summary: Validate Memory
      description: Increment a memory's validation_count (signals higher trust).
      operationId: validate_memory_v1_memories__memory_id__validate_post
      parameters:
      - name: memory_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Validate Memory V1 Memories  Memory Id  Validate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/memories/batch:
    post:
      tags:
      - Memories
      summary: Add Memories Batch
      description: Add multiple memories in a single request (up to 50).
      operationId: add_memories_batch_v1_memories_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAddMemoryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Add Memories Batch V1 Memories Batch Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/search:
    post:
      tags:
      - Search
      summary: Search
      description: Hybrid search across memory (graph) and RAG (vector).
      operationId: search_v1_search_post
      parameters:
      - name: page_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Page token for pagination
          title: Page Token
        description: Page token for pagination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Search V1 Search Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Search
      summary: Search Get
      description: GET variant of search.
      operationId: search_get_v1_search_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Q
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
          title: Entity Id
      - name: search_mode
        in: query
        required: false
        schema:
          type: string
          default: hybrid
          title: Search Mode
      - name: top_k
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 30
          title: Top K
      - name: rewrite_query
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Rewrite Query
      - name: min_confidence
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Min Confidence
      - name: dynamic_truncation
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Dynamic Truncation
      - name: about
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Entity-centric retrieval (B4): a mention canonical form or mention id — returns
            the entity''s memories mentioning it across all surface forms. Skips RAG and fast-lane paths.'
          title: About
        description: 'Entity-centric retrieval (B4): a mention canonical form or mention id — returns
          the entity''s memories mentioning it across all surface forms. Skips RAG and fast-lane paths.'
      - name: depth
        in: query
        required: false
        schema:
          type: integer
          maximum: 4
          minimum: 0
          description: 'Graph traversal hops (B4): >=1 walks shared-subject mention bridges and relationship
            edges (UPDATES / EXTENDS / DERIVES_FROM, both directions). 0 = status quo. Historical nodes
            surface only along UPDATES chains and are marked is_latest=false.'
          default: 0
          title: Depth
        description: 'Graph traversal hops (B4): >=1 walks shared-subject mention bridges and relationship
          edges (UPDATES / EXTENDS / DERIVES_FROM, both directions). 0 = status quo. Historical nodes
          surface only along UPDATES chains and are marked is_latest=false.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Search Get V1 Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/profiles/{entity_id}:
    get:
      tags:
      - Profiles
      summary: Get Profile
      description: Get entity profile (static + dynamic facts).
      operationId: get_profile_v1_profiles__entity_id__get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Profile V1 Profiles  Entity Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/profiles/{entity_id}/memory.md:
    get:
      tags:
      - Profiles
      summary: Get Memory Markdown
      description: Export entity memory as a MEMORY.md-style Markdown document.
      operationId: get_memory_markdown_v1_profiles__entity_id__memory_md_get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/profiles/{entity_id}/config:
    get:
      tags:
      - Profiles
      summary: Get Profile Config
      description: Get per-entity profile configuration overrides.
      operationId: get_profile_config_v1_profiles__entity_id__config_get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Profile Config V1 Profiles  Entity Id  Config Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Profiles
      summary: Update Profile Config
      description: 'Set per-entity profile configuration overrides.


        Overrides are stored in Redis and take effect on the next profile

        computation.  The cached profile is invalidated immediately so the

        next GET returns a profile computed with the new config.'
      operationId: update_profile_config_v1_profiles__entity_id__config_put
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileConfig'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Profile Config V1 Profiles  Entity Id  Config Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Profiles
      summary: Delete Profile Config
      description: Reset profile config to class defaults.
      operationId: delete_profile_config_v1_profiles__entity_id__config_delete
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Delete Profile Config V1 Profiles  Entity Id  Config Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/upload:
    post:
      tags:
      - Upload
      summary: Upload File
      description: 'Upload a file (PDF, image, audio, video, code, etc.) for async

        extraction, chunking, embedding, and indexing. Returns 202 Accepted

        with a pipeline_id to poll via ``GET /v1/pipelines/{id}``.


        File size limit: 50MB.'
      operationId: upload_file_v1_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_file_v1_upload_post'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Upload File V1 Upload Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/files:
    get:
      tags:
      - Upload
      summary: List Files
      description: List uploaded files for an entity with cursor-based pagination.
      operationId: list_files_v1_files_get
      parameters:
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
          title: Entity Id
      - name: status_filter
        in: query
        required: false
        schema:
          type: string
          default: done
          title: Status Filter
      - name: page_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Cursor token for pagination
          title: Page Token
        description: Cursor token for pagination
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 20
          title: Page Size
        description: Items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Files V1 Files Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/pipelines/{pipeline_id}:
    get:
      tags:
      - Pipelines
      summary: Get Pipeline Status
      description: 'Look up the current status of an async pipeline job (file upload,

        large-document extraction, embedding indexing).


        Status values: queued | extracting | chunking | embedding | indexing | done | failed.'
      operationId: get_pipeline_status_v1_pipelines__pipeline_id__get
      parameters:
      - name: pipeline_id
        in: path
        required: true
        schema:
          type: string
          title: Pipeline Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineStatusEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/conflicts/{conflict_id}/resolve:
    post:
      tags:
      - Conflicts
      summary: Resolve Conflict
      description: Resolve a pending high-impact conflict.
      operationId: resolve_conflict_v1_conflicts__conflict_id__resolve_post
      parameters:
      - name: conflict_id
        in: path
        required: true
        schema:
          type: string
          title: Conflict Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveConflictRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Resolve Conflict V1 Conflicts  Conflict Id  Resolve Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/extract-url:
    post:
      tags:
      - Extract
      summary: Extract Url
      description: 'Extract title, description, favicon from a URL.


        Authenticated and rate-limited: the endpoint performs an outbound

        HTTP fetch, so without auth it is an unauthenticated SSRF/resource-

        abuse surface (audit finding 2026-08-10, fixed).'
      operationId: extract_url_v1_extract_url_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractUrlRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Extract Url V1 Extract Url Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions:
    post:
      tags:
      - Sessions
      summary: Create Session
      description: Issue a short-lived JWT session token scoped to an entity/project.
      operationId: create_session_v1_sessions_post
      parameters:
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
          title: Entity Id
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Id
      - name: session_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
      - name: ttl_hours
        in: query
        required: false
        schema:
          type: number
          default: 24
          title: Ttl Hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Session V1 Sessions Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions/verify:
    get:
      tags:
      - Sessions
      summary: Verify Session
      description: Verify a session token and return its claims.
      operationId: verify_session_v1_sessions_verify_get
      parameters:
      - name: X-Session-Token
        in: header
        required: true
        schema:
          type: string
          title: X-Session-Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Verify Session V1 Sessions Verify Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources/connect:
    post:
      tags:
      - Sources
      summary: Create Connect Session
      description: 'Open the account-linking flow: returns the hub''s auth link.


        The end user is sent to ``auth_link_url``; after authorizing on the

        hub, the connection appears under the tenant and is bound via

        ``POST /v1/sources/refresh`` (Totem v1: no account.connected push).'
      operationId: create_connect_session_v1_sources_connect_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Connect Session V1 Sources Connect Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources/webhook:
    post:
      tags:
      - Sources
      summary: Receive Webhook
      description: 'Hub event delivery endpoint (the "bell").


        v1: Emerald''s own upstream subscription delivers here — the handler

        only records/enqueues, every Feishu read/write goes through Totem

        actions (totem ADR-0011). Verification implements the platform''s

        pre-recorded contract (standard §8.3): HMAC-SHA256 over the raw body,

        ``x-totem-signature``, constant-time compare. No API key — the

        signature is the credential.'
      operationId: receive_webhook_v1_sources_webhook_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Receive Webhook V1 Sources Webhook Post
  /v1/sources:
    get:
      tags:
      - Sources
      summary: List Sources
      description: List source bindings for an entity.
      operationId: list_sources_v1_sources_get
      parameters:
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
          title: Entity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Sources V1 Sources Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources/refresh:
    post:
      tags:
      - Sources
      summary: Refresh Sources
      description: 'Reconcile bindings with the hub: upsert newly authorized accounts.


        Call this after the user returns from the hub''s auth link; in v1 it

        is the primary binding path (Totem delivers no ``account.connected``

        push — ADR-0011).'
      operationId: refresh_sources_v1_sources_refresh_post
      parameters:
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
          title: Entity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Refresh Sources V1 Sources Refresh Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources/{binding_id}:
    delete:
      tags:
      - Sources
      summary: Delete Source
      description: Remove a source binding (data stays in the graph; new syncs stop).
      operationId: delete_source_v1_sources__binding_id__delete
      parameters:
      - name: binding_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Binding Id
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
          title: Entity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Delete Source V1 Sources  Binding Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/spaces:
    get:
      tags:
      - Spaces
      summary: List Spaces
      description: List all spaces for an entity.
      operationId: list_spaces_v1_spaces_get
      parameters:
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
          title: Entity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Spaces V1 Spaces Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Spaces
      summary: Create Space
      description: Create a new space.
      operationId: create_space_v1_spaces_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Space V1 Spaces Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/spaces/{container_tag}:
    patch:
      tags:
      - Spaces
      summary: Update Space
      description: Update a space's name and/or emoji.
      operationId: update_space_v1_spaces__container_tag__patch
      parameters:
      - name: container_tag
        in: path
        required: true
        schema:
          type: string
          title: Container Tag
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
          title: Entity Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Space V1 Spaces  Container Tag  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Spaces
      summary: Delete Space
      description: Delete a space. Memories are detached (container_tag becomes null) by default.
      operationId: delete_space_v1_spaces__container_tag__delete
      parameters:
      - name: container_tag
        in: path
        required: true
        schema:
          type: string
          title: Container Tag
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
          title: Entity Id
      - name: detach_memories
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Detach Memories
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Delete Space V1 Spaces  Container Tag  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/health:
    get:
      tags:
      - System
      summary: Health Check
      description: 'Probe all backing services (Postgres, Neo4j, Redis, MinIO) and return

        a structured health report. Does not require authentication.'
      operationId: health_check_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check V1 Health Get
  /v1/memories/graph:
    get:
      tags:
      - System
      summary: Memories Graph
      description: 'Return graph data (nodes + edges) for visualization.


        Suitable for D3.js / vis-network force-directed graph rendering.

        Requires API key authentication.'
      operationId: memories_graph_v1_memories_graph_get
      parameters:
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
          title: Entity Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Memories Graph V1 Memories Graph Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/keys:
    post:
      tags:
      - Keys
      summary: Create Key
      description: 'Create an API key for the caller''s entity.  The plaintext key is

        returned exactly once; only its SHA-256 hash is stored.'
      operationId: create_key_v1_keys_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateKeyEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Keys
      summary: List Keys
      description: List the caller's entity's key metadata (no hashes, no raw keys).
      operationId: list_keys_v1_keys_get
      parameters:
      - name: page_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Cursor token for pagination
          title: Page Token
        description: Cursor token for pagination
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 20
          title: Page Size
        description: Items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListKeysEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/keys/{key_id}:
    delete:
      tags:
      - Keys
      summary: Revoke Key
      description: 'Revoke a key of the caller''s entity.  Soft delete: the auth query

        filters ``is_active=True``, so the key is rejected with 401 immediately.'
      operationId: revoke_key_v1_keys__key_id__delete
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          title: Key Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AddMemoryRequest:
      properties:
        content:
          type: string
          title: Content
          examples:
          - 用户偏好 TypeScript 和函数式编程风格
        entity_id:
          type: string
          title: Entity Id
          examples:
          - user_123
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
          examples:
          - text
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        async_mode:
          type: boolean
          title: Async Mode
          default: false
        idempotency_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency Key
          description: Client-provided idempotency key. Same key + entity yields same result for 1 hour.
        require_confirmation_for_high_impact:
          type: boolean
          title: Require Confirmation For High Impact
          description: When true, high-impact contradictions are flagged for confirmation instead of auto-resolved.
          default: false
        memory_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Memory Type
          description: Override the LLM-extracted memory type. Must be one of 'fact', 'preference', or
            'episodic' if provided.
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
          description: Override the LLM-assigned confidence score (0.0-1.0). Useful for human-verified
            or operator-curated entries.
        container_tag:
          anyOf:
          - type: string
          - type: 'null'
          title: Container Tag
          description: Optional space/container tag to associate this memory with. Null (default) means
            the memory belongs to no space.
        valid_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Valid Until
          description: When this memory should be considered expired (e.g. 'I have an exam tomorrow').
            The ForgetEngine will mark it not_latest after this time. None means no expiry.
      type: object
      required:
      - content
      - entity_id
      title: AddMemoryRequest
    BatchAddMemoryRequest:
      properties:
        memories:
          items:
            $ref: '#/components/schemas/AddMemoryRequest'
          type: array
          maxItems: 50
          title: Memories
          description: Up to 50 memories to add in a single batch.
      type: object
      required:
      - memories
      title: BatchAddMemoryRequest
    Body_upload_file_v1_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        entity_id:
          type: string
          title: Entity Id
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      type: object
      required:
      - file
      - entity_id
      title: Body_upload_file_v1_upload_post
    ConnectRequest:
      properties:
        entity_id:
          type: string
          title: Entity Id
          description: Entity that will own the binding
        provider:
          type: string
          title: Provider
          description: Provider key on the hub (feishu)
      type: object
      required:
      - entity_id
      - provider
      title: ConnectRequest
    CreateKeyEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/CreateKeyResponse'
        meta:
          $ref: '#/components/schemas/_Meta'
      type: object
      required:
      - data
      - meta
      title: CreateKeyEnvelope
    CreateKeyRequest:
      properties:
        entity_id:
          type: string
          title: Entity Id
          description: External entity id the key is scoped to
        permissions:
          items:
            type: string
          type: array
          title: Permissions
          description: 'Permission levels: read, write, admin'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
          description: Optional expiry; the key returns 401 after this time
      type: object
      required:
      - entity_id
      - permissions
      title: CreateKeyRequest
      description: 'Create a new API key for the caller''s entity.


        ``entity_id`` is the external entity id and must match the caller''s

        own entity (management is entity-scoped: an admin key manages keys

        within its own entity only).'
    CreateKeyResponse:
      properties:
        key:
          type: string
          title: Key
        key_id:
          type: string
          title: Key Id
        key_prefix:
          type: string
          title: Key Prefix
        permissions:
          items:
            type: string
          type: array
          title: Permissions
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        entity_id:
          type: string
          title: Entity Id
      type: object
      required:
      - key
      - key_id
      - key_prefix
      - permissions
      - entity_id
      title: CreateKeyResponse
      description: 'Create response.  ``key`` (plaintext) appears exactly once — the

        server stores only its SHA-256 hash and cannot recover it.'
    ExtractUrlRequest:
      properties:
        url:
          type: string
          title: Url
          examples:
          - https://example.com/article
      type: object
      required:
      - url
      title: ExtractUrlRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    KeyMetadata:
      properties:
        key_id:
          type: string
          title: Key Id
        key_prefix:
          type: string
          title: Key Prefix
        permissions:
          items:
            type: string
          type: array
          title: Permissions
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        is_active:
          type: boolean
          title: Is Active
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
      type: object
      required:
      - key_id
      - key_prefix
      - permissions
      - is_active
      title: KeyMetadata
      description: 'Key metadata for list responses — never carries the hash or the

        raw key (they are not recoverable by design).'
    ListKeysData:
      properties:
        items:
          items:
            $ref: '#/components/schemas/KeyMetadata'
          type: array
          title: Items
        page_size:
          type: integer
          title: Page Size
      type: object
      required:
      - items
      - page_size
      title: ListKeysData
    ListKeysEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/ListKeysData'
        meta:
          $ref: '#/components/schemas/_Meta'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      type: object
      required:
      - data
      - meta
      - pagination
      title: ListKeysEnvelope
    PaginationMeta:
      properties:
        next_page_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Page Token
          description: Token for the next page. null if this is the last page.
        has_more:
          type: boolean
          title: Has More
          description: Whether there are more results beyond this page.
          default: false
        total_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Count
          description: Total number of results (when available, may be null for search).
      type: object
      title: PaginationMeta
      description: Cursor-based pagination metadata (v2).
    PipelineStatusEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/PipelineStatusResponse'
        meta:
          additionalProperties: true
          type: object
          title: Meta
      type: object
      required:
      - data
      - meta
      title: PipelineStatusEnvelope
      description: 'Envelope for GET /v1/pipelines/{id}（与 keys.py 的 Envelope 派惯例一致）。


        此前路由声明 response_model=PipelineStatusResponse 但返回 {data, meta}

        信封，导致每次命中都 ResponseValidationError→500（D2 轮询依赖端点，

        2026-08-15 :80 冒烟发现）。'
    PipelineStatusResponse:
      properties:
        pipeline_id:
          type: string
          title: Pipeline Id
        status:
          type: string
          title: Status
        stage:
          type: string
          title: Stage
          default: ''
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        content_type:
          type: string
          title: Content Type
          default: ''
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        fact_extraction_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Fact Extraction Status
        memory_count:
          type: integer
          title: Memory Count
          default: 0
      type: object
      required:
      - pipeline_id
      - status
      title: PipelineStatusResponse
    ProfileConfig:
      properties:
        static_max_items:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Static Max Items
          default: 10
        dynamic_max_items:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Dynamic Max Items
          default: 5
        dynamic_lookback_days:
          type: integer
          maximum: 90.0
          minimum: 1.0
          title: Dynamic Lookback Days
          default: 7
        min_confidence_static:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Min Confidence Static
          default: 0.5
        min_confidence_dynamic:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Min Confidence Dynamic
          default: 0.3
      type: object
      title: ProfileConfig
    ResolutionAction:
      type: string
      enum:
      - keep_old
      - keep_new
      - keep_both
      - manual
      title: ResolutionAction
    ResolveConflictRequest:
      properties:
        action:
          $ref: '#/components/schemas/ResolutionAction'
      type: object
      required:
      - action
      title: ResolveConflictRequest
    SearchRequest:
      properties:
        q:
          type: string
          title: Q
          default: ''
          examples:
          - 用户偏好什么编程语言？
        entity_id:
          type: string
          title: Entity Id
          examples:
          - user_123
        search_mode:
          type: string
          title: Search Mode
          default: hybrid
          examples:
          - hybrid
        top_k:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Top K
          default: 30
        rerank:
          type: boolean
          title: Rerank
          default: false
        rewrite_query:
          type: boolean
          title: Rewrite Query
          default: false
        filters:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Filters
        min_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Min Confidence
        dynamic_truncation:
          type: boolean
          title: Dynamic Truncation
          default: true
        about:
          anyOf:
          - type: string
          - type: 'null'
          title: About
          description: 'Entity-centric retrieval (B4): a mention canonical form or mention id — returns
            the entity''s memories mentioning it across all surface forms. Skips RAG and fast-lane paths.'
        depth:
          type: integer
          maximum: 4.0
          minimum: 0.0
          title: Depth
          description: 'Graph traversal hops (B4): >=1 walks shared-subject mention bridges (Memory-MENTIONS->Mention<-MENTIONS-Memory)
            and relationship edges (UPDATES / EXTENDS / DERIVES_FROM, both directions). 0 = status quo.
            Historical nodes surface only along UPDATES chains and are marked is_latest=false.'
          default: 0
      type: object
      required:
      - entity_id
      title: SearchRequest
    SpaceCreateRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          examples:
          - Work
        emoji:
          type: string
          maxLength: 10
          title: Emoji
          default: 📁
          examples:
          - 💼
        entity_id:
          type: string
          title: Entity Id
          examples:
          - user_123
      type: object
      required:
      - name
      - entity_id
      title: SpaceCreateRequest
    SpaceUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Name
        emoji:
          anyOf:
          - type: string
            maxLength: 10
          - type: 'null'
          title: Emoji
      type: object
      title: SpaceUpdateRequest
    UpdateMemoryRequest:
      properties:
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
          examples:
          - Updated content
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
          examples:
          - Updated summary
        memory_type:
          anyOf:
          - type: string
            pattern: ^(fact|preference|episodic)$
          - type: 'null'
          title: Memory Type
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
      type: object
      title: UpdateMemoryRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    _Meta:
      properties:
        request_id:
          type: string
          title: Request Id
        took_ms:
          type: integer
          title: Took Ms
      type: object
      required:
      - request_id
      - took_ms
      title: _Meta
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: em_<32-hex>
      description: All endpoints require a Bearer API key in the `Authorization` header. Keys are prefixed
        with `em_` and scoped to a single entity. The server stores only the SHA-256 hash.
servers:
- url: http://localhost:8000/v1
  description: Local development
- url: https://api.emerald.ai/v1
  description: Production
tags:
- name: Memories
  description: Ingest and retrieve memories
- name: Search
  description: Hybrid search across memory and RAG
- name: Profiles
  description: Entity profiles and context
- name: Upload
  description: File upload and pipeline tracking
- name: Connectors
  description: External data source integrations
- name: System
  description: Health and metrics
x-emerald-meta:
  content_types:
    supported:
    - text
    - conversation
    - url
    - pdf
    - image
    - audio
    - video
    - code
    - markdown
security:
- ApiKeyAuth: []
