- name: Connectors
  description: External data source integrations
- name: System
  description: Health and metrics
x-emerald-meta:
  content_types:
    supported:
    - text
    - conversation
    - url
    - pdf
    - image
    - audio
    - video
    - code
    - markdown
security:
- ApiKeyAuth: []
