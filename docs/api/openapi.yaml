        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/memories/batch:
    post:
      tags:
      - Memories
      summary: Add Memories Batch
      description: Add multiple memories in a single request (up to 50).
      operationId: add_memories_batch_v2_memories_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAddMemoryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Add Memories Batch V2 Memories Batch Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/search:
    post:
      tags:
      - Search
      summary: Search
      description: Hybrid search across memory (graph) and RAG (vector).
      operationId: search_v2_search_post
      parameters:
      - name: page_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Page token for pagination
          title: Page Token
        description: Page token for pagination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
