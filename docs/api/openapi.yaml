components:
  schemas:
    AddMemoryRequest:
      properties:
        content:
          type: string
          title: Content
          examples:
          - 用户偏好 TypeScript 和函数式编程风格
        entity_id:
          type: string
          title: Entity Id
          examples:
          - user_123
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
          examples:
          - text
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        async_mode:
          type: boolean
          title: Async Mode
          default: false
        idempotency_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency Key
          description: Client-provided idempotency key. Same key + entity yields same result for 1 hour.
        require_confirmation_for_high_impact:
          type: boolean
          title: Require Confirmation For High Impact
          description: When true, high-impact contradictions are flagged for confirmation instead of auto-resolved.
          default: false
        memory_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Memory Type
          description: Override the LLM-extracted memory type. Must be one of 'fact', 'preference', or
            'episodic' if provided.
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
          description: Override the LLM-assigned confidence score (0.0-1.0). Useful for human-verified
            or operator-curated entries.
        valid_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Valid Until
          description: When this memory should be considered expired (e.g. 'I have an exam tomorrow').
            The ForgetEngine will mark it not_latest after this time. None means no expiry.
      type: object
      required:
      - content
      - entity_id
      title: AddMemoryRequest
    BatchAddMemoryRequest:
      properties:
        memories:
          items:
            $ref: '#/components/schemas/AddMemoryRequest'
          type: array
          maxItems: 50
          title: Memories
          description: Up to 50 memories to add in a single batch.
      type: object
      required:
      - memories
      title: BatchAddMemoryRequest
    Body_upload_file_v1_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        entity_id:
          type: string
          title: Entity Id
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      type: object
      required:
      - file
      - entity_id
      title: Body_upload_file_v1_upload_post
    Body_upload_file_v2_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        entity_id:
          type: string
          title: Entity Id
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      type: object
      required:
      - file
      - entity_id
      title: Body_upload_file_v2_upload_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PipelineStatusResponse:
      properties:
        pipeline_id:
          type: string
          title: Pipeline Id
        status:
          type: string
          title: Status
        stage:
          type: string
          title: Stage
          default: ''
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        content_type:
          type: string
          title: Content Type
          default: ''
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        fact_extraction_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Fact Extraction Status
        memory_count:
          type: integer
          title: Memory Count
          default: 0
      type: object
      required:
      - pipeline_id
      - status
      title: PipelineStatusResponse
    ProfileConfig:
      properties:
        static_max_items:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Static Max Items
          default: 10
        dynamic_max_items:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Dynamic Max Items
          default: 5
        dynamic_lookback_days:
          type: integer
          maximum: 90.0
          minimum: 1.0
          title: Dynamic Lookback Days
          default: 7
        min_confidence_static:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Min Confidence Static
          default: 0.5
        min_confidence_dynamic:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Min Confidence Dynamic
          default: 0.3
      type: object
      title: ProfileConfig
    ResolutionAction:
      type: string
      enum:
      - keep_old
      - keep_new
      - keep_both
      - manual
      title: ResolutionAction
    ResolveConflictRequest:
      properties:
        action:
          $ref: '#/components/schemas/ResolutionAction'
      type: object
      required:
      - action
      title: ResolveConflictRequest
    SearchRequest:
      properties:
        q:
          type: string
          title: Q
          examples:
          - 用户偏好什么编程语言？
        entity_id:
          type: string
          title: Entity Id
          examples:
          - user_123
        search_mode:
          type: string
          title: Search Mode
          default: hybrid
          examples:
          - hybrid
        top_k:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Top K
          default: 30
        rerank:
          type: boolean
          title: Rerank
          default: false
        rewrite_query:
          type: boolean
          title: Rewrite Query
          default: false
        filters:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Filters
        min_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Min Confidence
        dynamic_truncation:
          type: boolean
          title: Dynamic Truncation
          default: true
      type: object
      required:
      - q
      - entity_id
      title: SearchRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: em_<32-hex>
      description: All endpoints require a Bearer API key in the `Authorization` header. Keys are prefixed
        with `em_` and scoped to a single entity. The server stores only the SHA-256 hash.
