openapi: 3.1.0
info:
  title: Emerald
  description: Memory and context infrastructure for AI agents
  version: 0.3.0
  contact:
    name: Emerald
    url: https://emerald.ai
  license:
    name: MIT
paths:
  /v1/memories:
    post:
      tags:
      - Memories
      summary: Add Memory
      description: Add content to the memory graph.
      operationId: add_memory_v1_memories_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemoryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Add Memory V1 Memories Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/memories/{memory_id}:
    get:
      tags:
      - Memories
      summary: Get Memory
      description: Get a single memory by ID.
      operationId: get_memory_v1_memories__memory_id__get
      parameters:
      - name: memory_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Memory V1 Memories  Memory Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Memories
      summary: Delete Memory
      description: Delete a memory by ID (soft delete — mark as not latest).
      operationId: delete_memory_v1_memories__memory_id__delete
      parameters:
      - name: memory_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Delete Memory V1 Memories  Memory Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/memories/{memory_id}/validate:
    post:
      tags:
      - Memories
      summary: Validate Memory
      description: Increment a memory's validation_count (signals higher trust).
      operationId: validate_memory_v1_memories__memory_id__validate_post
      parameters:
      - name: memory_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Validate Memory V1 Memories  Memory Id  Validate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/memories/batch:
    post:
      tags:
      - Memories
      summary: Add Memories Batch
      description: Add multiple memories in a single request (up to 50).
      operationId: add_memories_batch_v1_memories_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAddMemoryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Add Memories Batch V1 Memories Batch Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/search:
    post:
      tags:
      - Search
      summary: Search
      description: Hybrid search across memory (graph) and RAG (vector).
      operationId: search_v1_search_post
      parameters:
      - name: page_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Page token for pagination
          title: Page Token
        description: Page token for pagination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Search V1 Search Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Search
      summary: Search Get
      description: GET variant of search.
      operationId: search_get_v1_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          title: Q
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
          title: Entity Id
      - name: search_mode
        in: query
        required: false
        schema:
          type: string
          default: hybrid
          title: Search Mode
      - name: top_k
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 30
          title: Top K
      - name: rewrite_query
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Rewrite Query
      - name: min_confidence
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Min Confidence
      - name: dynamic_truncation
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Dynamic Truncation
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Search Get V1 Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/profiles/{entity_id}:
    get:
      tags:
      - Profiles
      summary: Get Profile
      description: Get entity profile (static + dynamic facts).
      operationId: get_profile_v1_profiles__entity_id__get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Profile V1 Profiles  Entity Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/profiles/{entity_id}/memory.md:
    get:
      tags:
      - Profiles
      summary: Get Memory Markdown
      description: Export entity memory as a MEMORY.md-style Markdown document.
      operationId: get_memory_markdown_v1_profiles__entity_id__memory_md_get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/profiles/{entity_id}/config:
    get:
      tags:
      - Profiles
      summary: Get Profile Config
      description: Get per-entity profile configuration overrides.
      operationId: get_profile_config_v1_profiles__entity_id__config_get
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Profile Config V1 Profiles  Entity Id  Config Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Profiles
      summary: Update Profile Config
      description: 'Set per-entity profile configuration overrides.


        Overrides are stored in Redis and take effect on the next profile

        computation.  The cached profile is invalidated immediately so the

        next GET returns a profile computed with the new config.'
      operationId: update_profile_config_v1_profiles__entity_id__config_put
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileConfig'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Profile Config V1 Profiles  Entity Id  Config Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Profiles
      summary: Delete Profile Config
      description: Reset profile config to class defaults.
      operationId: delete_profile_config_v1_profiles__entity_id__config_delete
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Delete Profile Config V1 Profiles  Entity Id  Config Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/upload:
    post:
      tags:
      - Upload
      summary: Upload File
      description: 'Upload a file (PDF, image, audio, video, code, etc.) for async

        extraction, chunking, embedding, and indexing. Returns 202 Accepted

        with a pipeline_id to poll via ``GET /v1/pipelines/{id}``.


        File size limit: 50MB.'
      operationId: upload_file_v1_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_file_v1_upload_post'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Upload File V1 Upload Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/files:
    get:
      tags:
      - Upload
      summary: List Files
      description: List uploaded files for an entity with cursor-based pagination.
      operationId: list_files_v1_files_get
      parameters:
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
          title: Entity Id
      - name: status_filter
        in: query
        required: false
        schema:
          type: string
          default: done
          title: Status Filter
      - name: page_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Cursor token for pagination
          title: Page Token
        description: Cursor token for pagination
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 20
          title: Page Size
        description: Items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Files V1 Files Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/pipelines/{pipeline_id}:
    get:
      tags:
      - Pipelines
      summary: Get Pipeline Status
      description: 'Look up the current status of an async pipeline job (file upload,

        large-document extraction, embedding indexing).


        Status values: queued | extracting | chunking | embedding | indexing | done | failed.'
      operationId: get_pipeline_status_v1_pipelines__pipeline_id__get
      parameters:
      - name: pipeline_id
        in: path
        required: true
        schema:
          type: string
          title: Pipeline Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/conflicts/{conflict_id}/resolve:
    post:
      tags:
      - Conflicts
      summary: Resolve Conflict
      description: Resolve a pending high-impact conflict.
      operationId: resolve_conflict_v1_conflicts__conflict_id__resolve_post
      parameters:
      - name: conflict_id
        in: path
        required: true
        schema:
          type: string
          title: Conflict Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveConflictRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Resolve Conflict V1 Conflicts  Conflict Id  Resolve Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions:
    post:
      tags:
      - Sessions
      summary: Create Session
      description: Issue a short-lived JWT session token scoped to an entity/project.
      operationId: create_session_v1_sessions_post
      parameters:
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
          title: Entity Id
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Id
      - name: session_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
      - name: ttl_hours
        in: query
        required: false
        schema:
          type: number
          default: 24
          title: Ttl Hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Session V1 Sessions Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions/verify:
    get:
      tags:
      - Sessions
      summary: Verify Session
      description: Verify a session token and return its claims.
      operationId: verify_session_v1_sessions_verify_get
      parameters:
      - name: X-Session-Token
        in: header
        required: true
        schema:
          type: string
          title: X-Session-Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Verify Session V1 Sessions Verify Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{provider}/connect:
    post:
      tags:
      - Connectors
      summary: Connect Provider
      description: 'Initiate OAuth connection to an external data source.


        Providers: google_drive, gmail, notion, github.

        Returns the OAuth authorization URL for the user to visit.'
      operationId: connect_provider_v1_connectors__provider__connect_post
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Redirect Uri
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Connect Provider V1 Connectors  Provider  Connect Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{provider}/callback:
    get:
      tags:
      - Connectors
      summary: Handle Oauth Callback
      description: OAuth callback - exchange code for token and store credentials.
      operationId: handle_oauth_callback_v1_connectors__provider__callback_get
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
      - name: state
        in: query
        required: true
        schema:
          type: string
          title: State
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Handle Oauth Callback V1 Connectors  Provider  Callback Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{provider}/webhook:
    post:
      tags:
      - Connectors
      summary: Handle Webhook
      description: 'Receive webhook notifications from external providers.


        Validates signature, deduplicates, triggers incremental sync.'
      operationId: handle_webhook_v1_connectors__provider__webhook_post
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Handle Webhook V1 Connectors  Provider  Webhook Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/connectors/{provider}:
    get:
      tags:
      - Connectors
      summary: Get Connector Status
      description: Get connector sync status for the authenticated entity.
      operationId: get_connector_status_v1_connectors__provider__get
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Connector Status V1 Connectors  Provider  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Connectors
      summary: Revoke Connector
      description: Revoke OAuth connection and delete stored credentials.
      operationId: revoke_connector_v1_connectors__provider__delete
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/health:
    get:
      tags:
      - System
      summary: Health Check
      description: 'Probe all backing services (Postgres, Neo4j, Redis, MinIO) and return

        a structured health report. Does not require authentication.'
      operationId: health_check_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check V1 Health Get
  /v1/memories/graph:
    get:
      tags:
      - System
      summary: Memories Graph
      description: 'Return graph data (nodes + edges) for visualization.


        Suitable for D3.js / vis-network force-directed graph rendering.

        Requires API key authentication.'
      operationId: memories_graph_v1_memories_graph_get
      parameters:
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
          title: Entity Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Memories Graph V1 Memories Graph Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
