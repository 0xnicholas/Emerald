# Gitleaks configuration for Emerald
# Detects hardcoded secrets, API keys, tokens, and credentials in the codebase.

title = "Emerald Gitleaks Config"

[allowlist]
  description = "Global allowlist"
  paths = [
    '''tests/''',
    '''docs/''',
    '''.venv/''',
    '''backups/''',
  ]

[[rules]]
  id = "generic-api-key"
  description = "Generic API Key"
  regex = '''(?i)(api[_-]?key|apikey|secret|token|password|passwd|auth)\s*[:=]\s*['"][^'"]{16,}['"]'''
  tags = ["api-key", "secret"]

[[rules]]
  id = "private-key"
  description = "Private Key"
  regex = '''-----BEGIN\s?(RSA|OPENSSH|DSA|EC|PGP)?\s?PRIVATE KEY-----'''
  tags = ["key", "private-key"]

[[rules]]
  id = "jwt-token"
  description = "JWT Token"
  regex = '''eyJ[a-zA-Z0-9]{10,}\.[a-zA-Z0-9]{10,}\.[a-zA-Z0-9_-]{10,}'''
  tags = ["jwt", "token"]

[[rules]]
  id = "openai-key"
  description = "OpenAI API Key"
  regex = '''sk-[a-zA-Z0-9]{32,}'''
  tags = ["openai", "api-key"]

[[rules]]
  id = "neo4j-connection"
  description = "Neo4j connection string with credentials"
  regex = '''bolt://[^@]+@'''
  tags = ["database", "neo4j"]

[[rules]]
  id = "redis-connection"
  description = "Redis connection string with credentials"
  regex = '''redis://[^@]+@'''
  tags = ["database", "redis"]

[[rules]]
  id = "postgres-connection"
  description = "PostgreSQL connection string with credentials"
  regex = '''postgresql://[^@]+@'''
  tags = ["database", "postgres"]

[allowlist.rules]
  "generic-api-key" = [
    # Test fixtures / config defaults (not real secrets)
    '''api_key_secret: str = "change-me"''',
    '''"api_key_secret": "change-me"''',
    '''encryption_key: str = "0" * 64''',
    '''session_jwt_secret: str = "change-me-change-me-change-me-change-me"''',
  ]
  "neo4j-connection" = [
    # Dev defaults in config.py
    '''neo4j_uri: str = "bolt://localhost:7687"''',
    '''NEO4J_URI: bolt://localhost:7687''',
  ]
  "redis-connection" = [
    # Dev defaults in config.py and docker-compose
    '''redis_url: str = "redis://:emerald_dev@localhost:6379/0"''',
    '''REDIS_URL: redis://localhost:6379/0''',
    '''celery_broker_url: str = "redis://:emerald_dev@localhost:6379/1"''',
    '''celery_result_backend: str = "redis://:emerald_dev@localhost:6379/2"''',
  ]
  "postgres-connection" = [
    # Dev defaults in config.py
    '''database_url: str = "postgresql+asyncpg://emerald:emerald_dev@localhost:5432/emerald"''',
    '''DATABASE_URL: postgresql+asyncpg://emerald:emerald_dev@localhost:5432/emerald''',
    '''database_url_sync: str = "postgresql://emerald:emerald_dev@localhost:5432/emerald"''',
    '''DATABASE_URL_SYNC: postgresql://emerald:emerald_dev@localhost:5432/emerald''',
  ]
