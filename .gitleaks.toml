# Gitleaks configuration for Emerald
# Detects hardcoded secrets, API keys, tokens, and credentials in the codebase.
#
# Config notes (audit 2026-08-10):
# - Connection-string rules exclude '\n' from the credential class.  Go
#   negative character classes match newlines, so 'redis://[^@]+@' used to
#   swallow multi-line blocks up to the next '@' and produced 31 findings
#   across example/test files (all false positives).
# - Use the [allowlist] `regexes` field (matches the rule match text
#   itself).  The legacy '[allowlist.rules]' map form is not honored when
#   the [allowlist] block also defines `paths` (gitleaks 8.24.3 and
#   8.30.1 both drop it silently).
# - Example/test config files are exempted by path: their sole purpose is
#   to showcase placeholder credentials (emerald_dev etc.).

title = "Emerald Gitleaks Config"

[allowlist]
  description = "Global allowlist"
  paths = [
    '''tests/''',
    '''docs/''',
    '''.venv/''',
    '''backups/''',
    # Example / test configuration files — placeholder credentials only.
    '''\.env\.example''',
    '''\.env\.test''',
    '''\.env\.docker\.example''',
  ]
  # Regexes are matched against the rule match text (the captured secret).
  # Entries below carry the connection-string prefix exactly as the rule
  # captures it (up to the first '@').  These are the repository's dev
  # placeholder credentials (emerald_dev / emerald) used by docker-compose,
  # CI services and config defaults — not production secrets.
  regexes = [
    # Dev defaults in config.py / scripts / CI
    '''postgresql+asyncpg://emerald:emerald_dev@''',
    '''postgresql://emerald:emerald_dev@''',
    '''redis://:emerald_dev@''',
    '''redis://localhost:6379/0@''',
    # Test fixtures / config defaults (not real secrets)
    '''change-me''',
    '''0" * 64''',
  ]

[[rules]]
  id = "generic-api-key"
  description = "Generic API Key"
  regex = '''(?i)(api[_-]?key|apikey|secret|token|password|passwd|auth)\s*[:=]\s*['"][^'"]{16,}['"]'''
  tags = ["api-key", "secret"]

[[rules]]
  id = "private-key"
  description = "Private Key"
  regex = '''-----BEGIN\s?(RSA|OPENSSH|DSA|EC|PGP)?\s?PRIVATE KEY-----'''
  tags = ["key", "private-key"]

[[rules]]
  id = "jwt-token"
  description = "JWT Token"
  regex = '''eyJ[a-zA-Z0-9]{10,}\.[a-zA-Z0-9]{10,}\.[a-zA-Z0-9_-]{10,}'''
  tags = ["jwt", "token"]

[[rules]]
  id = "openai-key"
  description = "OpenAI API Key"
  regex = '''sk-[a-zA-Z0-9]{32,}'''
  tags = ["openai", "api-key"]

[[rules]]
  id = "neo4j-connection"
  description = "Neo4j connection string with credentials"
  # [^@\n]+ — exclude newline so the class cannot span lines; Go regex
  # negative character classes match \n, which made this rule swallow
  # multi-line blocks up to the next '@' (31 false-positive findings).
  regex = '''bolt://[^@\n]+@'''
  tags = ["database", "neo4j"]

[[rules]]
  id = "redis-connection"
  description = "Redis connection string with credentials"
  # See neo4j-connection: negative class must not span lines.
  regex = '''redis://[^@\n]+@'''
  tags = ["database", "redis"]

[[rules]]
  id = "postgres-connection"
  description = "PostgreSQL connection string with credentials"
  # See neo4j-connection: negative class must not span lines.
  regex = '''postgresql://[^@\n]+@'''
  tags = ["database", "postgres"]
