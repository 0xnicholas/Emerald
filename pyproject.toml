[project]
name = "emerald"
version = "0.4.0"
description = "Memory and context infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Emerald Contributors" }
]
keywords = ["memory", "knowledge-graph", "ai-agent", "rag", "context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "neo4j>=5.20",
    "pgvector>=0.3",
    "redis>=5.0",
    "celery[redis]>=5.3",
    "minio>=7.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "structlog>=24.0",
    "cryptography>=42.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-instrumentation-asyncpg>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
    "opentelemetry-instrumentation-celery>=0.45b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.8",
    "fakeredis>=2.0",
    "testcontainers>=4.0",
    "tenacity>=8.0",
]

mcp = [
    "fastmcp>=3.0,<4.0",
]

extraction = [
    "PyMuPDF>=1.23",
    "faster-whisper>=1.0",
    "Pillow>=10.0",
    "pytesseract>=0.3",
    "trafilatura>=1.12",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.23",
]

local-embeddings = [
    "fastembed>=0.4",
    "sentence-transformers>=2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emerald*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require Docker (testcontainers)",
    "docker: integration tests requiring Docker daemon",
    "quality: independent quality suites (ADR-0001): temporal correctness, forgetting effectiveness, graph relationship precision",
]
